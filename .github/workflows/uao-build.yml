name: UAO builds

# Unsigned desktop and Android artifacts for this fork.
# Tags named v* also attach the desktop files to that GitHub release so
# electron-updater can see latest-linux.yml / latest-mac.yml on
# https://github.com/tonytouch/orca/releases/latest
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
          cache-electron-package: 'true'
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install mobile dependencies
        uses: ./.github/actions/install-mobile-dependencies

      - name: Install pacman packaging tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build unsigned Linux packages
        run: |
          pnpm run build:desktop
          pnpm run ensure:electron-runtime
          pnpm exec electron-builder --config uao/electron-builder.config.cjs --linux AppImage pacman tar.gz --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: uao-linux
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.pacman
            dist/*.tar.gz
            dist/latest-linux*.yml

      - name: Attach Linux artifacts to the tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "UAO build. Linux and macOS artifacts are unsigned."
          gh release upload "$tag" dist/*.AppImage dist/*.pacman dist/*.tar.gz dist/latest-linux*.yml --clobber

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
          cache-electron-package: 'true'
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install mobile dependencies
        uses: ./.github/actions/install-mobile-dependencies

      - name: Build unsigned macOS dmg
        run: |
          pnpm run build:desktop
          pnpm run build:computer-macos
          pnpm run build:keyboard-layout-macos
          pnpm run build:notification-status-macos
          pnpm run ensure:electron-runtime
          pnpm exec electron-builder --config uao/electron-builder.config.cjs --mac --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: uao-macos
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/latest-mac.yml

      - name: Attach macOS artifacts to the tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "UAO build. Linux and macOS artifacts are unsigned."
          gh release upload "$tag" dist/*.dmg dist/latest-mac.yml --clobber

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build Android APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: uao-android
          if-no-files-found: error
          path: mobile/android/app/build/outputs/apk/release/*.apk
